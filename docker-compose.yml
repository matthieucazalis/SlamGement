services:
  db:
    image: postgres:16-alpine
    container_name: slamgement-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: slamgement
      POSTGRES_PASSWORD: slamgement_dev
      POSTGRES_DB: slamgement
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
