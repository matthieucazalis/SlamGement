services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: slamgement
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env.prod}
      POSTGRES_DB: slamgement
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slamgement -d slamgement"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: builder
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://slamgement:${POSTGRES_PASSWORD}@db:5432/slamgement
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://slamgement:${POSTGRES_PASSWORD}@db:5432/slamgement
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET manquant dans .env.prod}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
    # écoute en local uniquement : un reverse proxy (HTTPS) se place devant
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
