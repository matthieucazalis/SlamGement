name: CI

on:
  push:
  pull_request:

# Annule l'exécution précédente d'une même branche quand on pousse à nouveau
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # base de test : le nom se termine par _test (garde-fou des tests d'intégration)
  DATABASE_URL: postgresql://slamgement:slamgement_dev@localhost:5432/slamgement_test
  AUTH_SECRET: secret-de-ci-sans-valeur-en-production-0123456789
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Qualité (lint, types, tests, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: slamgement
          POSTGRES_PASSWORD: slamgement_dev
          POSTGRES_DB: slamgement_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slamgement -d slamgement_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build

  e2e:
    name: Tests de bout en bout (Playwright)
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: slamgement
          POSTGRES_PASSWORD: slamgement_dev
          POSTGRES_DB: slamgement_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slamgement -d slamgement_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  mobile:
    name: Application mobile (types, lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
